# Deploy:     cd worker && npx wrangler deploy        (also run by `npm run release`)
# Migrations: npx wrangler d1 migrations apply memento-mori --remote
# Secrets:    npx wrangler secret put APP_PASS            (the SPA passphrase)
#             npx wrangler secret put SECRET_TOKEN        (= TELEGRAM_SECRET_TOKEN)
#             npx wrangler secret put TELEGRAM_BOT_TOKEN
#             npx wrangler secret put TELEGRAM_USER_ID
#             npx wrangler secret put GEMINI_API_KEY
#             npx wrangler secret put INGEST_TOKEN        (= the GAS script property)
#             npx wrangler secret put IBKR_FLEX_TOKEN
#             npx wrangler secret put IBKR_FLEX_QUERY_ID
#
# A RENAME IS A MIGRATION, not an edit: `name` is the .workers.dev subdomain, so the
# app's URL, the Telegram webhook, the GAS WORKER_URL and the widgets' URL all move with
# it, and wrangler deploys a NEW Worker that has none of the old one's secrets. Done once,
# 2026-09-25 (financetracker-telegram -> memento-mori); MEMORY.md has the cutover.
name = "memento-mori"
main = "worker.js"
# UTC, and Cloudflare rejects a future date — Manila is a day ahead of UTC.
compatibility_date = "2026-07-28"

# Workers Logs. OFF by default, which is why the three ingests that failed on
# 2026-09-03/04 left nothing to read: worker.js already writes console.error for every
# handler that throws, but nobody was keeping it. `wrangler tail` only shows the present.
# With this on, the dashboard (Workers -> memento-mori -> Logs) holds the
# last few days and is searchable, so "why did that email not land" has an answer after
# the fact. Free plan; head_sampling_rate 1 = keep everything, this Worker does tens of
# requests a day.
# INHERITED by [env.staging], which is wanted — staging is where a change is checked.
[observability]
enabled = true
head_sampling_rate = 1

# The SPA. Asset requests bypass worker.js entirely and are free/unmetered, so only
# the routes below burn invocations. /mcp and the OAuth routes (src/oauth.js) would reach
# the Worker anyway, since no asset has their name; listing them keeps it that way.
#
# not_found_handling is deliberately left at the default: "single-page-application"
# would answer /api with index.html instead of invoking the Worker. Screen routing is
# on ?screen= query params, not paths, so there is nothing to fall back for.
[assets]
directory = "./public"
run_worker_first = ["/api", "/login", "/tg", "/mcp", "/authorize", "/token", "/register", "/.well-known/*"]

# The source of truth. --location=apac at creation time (nearest region to Manila).
#   npx wrangler d1 create memento-mori --location=apac   -> paste the id below
[[d1_databases]]
binding = "DB"
database_name = "memento-mori"
database_id = "45ade31b-96a8-4463-927e-34918d528a2b"
migrations_dir = "migrations"

# FX rates, cached 6h. This is the old API_CACHE namespace rebound: the edge read cache
# it used to hold existed to hide Apps Script latency and went away with GAS. Optional —
# unbound just means every FX lookup fetches.
[[kv_namespaces]]
binding = "FX_CACHE"
id = "414311e8408f43679204a86377b6c414"

# 3 of the 5 free cron triggers. UTC; Manila is UTC+8. src/jobs.js runScheduled() picks
# the job off event.cron, and a contract guard in test.js holds these strings equal
# to the constants there — a drifted string would run the wrong job on the wrong clock.
#   0 22 * * *   = 06:00 Manila — IBKR Flex -> prices, then the net-worth snapshot.
#   0 1 * * *    = 09:00 Manila — the same again, ONLY if 06:00's prices failed (meta
#                  prices_retry). One message if both fail, none if the retry works.
#   */2 * * * *  = the Telegram rescue drain (v2.12.0). It re-runs a turn whose
#                  invocation died mid-flight, which throws nothing and so reports
#                  nothing. Almost every firing reads one indexed row and stops, at ~720
#                  invocations a day against a 100k/day free ceiling.
# The free plan does NOT retry a failed cron; src/jobs.js reports failures to Telegram.
# The daily-interest cron was removed in v2.0.1 — the bank's own figures never matched it.
[triggers]
crons = ["0 22 * * *", "0 1 * * *", "*/2 * * * *"]

# ── staging ──────────────────────────────────────────────────────────────────
# `develop`'s deploy target — memento-mori-staging.<subdomain>.workers.dev,
# redeployed by .github/workflows/staging.yml on every push to develop. It exists so a
# change can be checked from a phone before the release PR is merged.
#
# There is no `name` key on purpose: wrangler appends the environment name to the
# top-level one: `memento-mori` + `-staging`.
#
# MOST keys are INHERITED — `main`, `compatibility_date`, `assets`, `workers_dev` and
# `triggers` — so the SPA and the routes need no repetition here. BINDINGS are not:
#   * d1_databases   repeated below, pointing at a SEPARATE database. test.js fails the
#                    build if the two ids ever match.
#   * kv_namespaces  deliberately NOT repeated. FX_CACHE is optional (unbound just means
#                    every FX lookup fetches), so staging skips the namespace entirely.
#   * triggers       INHERITED, which is the trap: without the empty override below,
#                    staging would run the 06:00 IBKR job, the net-worth snapshot and
#                    the 2-minute rescue drain against the staging database.
#
# Secrets are per-Worker and are NOT copied. Staging needs exactly one —
#   npx wrangler secret put APP_PASS --env staging
# and no other, because it has no bot, no Gmail courier and no cron.
[env.staging]

[[env.staging.d1_databases]]
binding = "DB"
database_name = "memento-mori-staging"
# npx wrangler d1 create memento-mori-staging --location=apac  -> paste the id here.
# test.js fails until this holds a real id.
database_id = "b5ae1938-8db0-4422-8b78-98e1276a19a5"
migrations_dir = "migrations"

# An empty list is how one environment cancels an inherited schedule.
[env.staging.triggers]
crons = []

# NOT a secret — a deliberately wrong value. worker.js checks the Telegram header only
# when SECRET_TOKEN is SET, so leaving it unset on a public hostname would make /tg an
# open write endpoint. Staging has no bot, so every real Telegram POST must be refused.
[env.staging.vars]
SECRET_TOKEN = "staging-has-no-bot"

name: Release

# The only path to live. A merge into main whose package.json version is not yet
# tagged applies the D1 migrations, deploys the Worker, tags vX.Y.Z and writes the
# GitHub Release. A push to main that does not change the version does nothing — a
# docs or Apps Script PR merges without a deploy. ci.yml refuses a worker/ change
# without a bump, so main never holds code that is not live.
#
# Order is load-bearing and matches the old release.js: migrations run BEFORE the
# deploy, and the deploy before the tag. New code must never meet an old schema, and
# a failed deploy must abort rather than leave a tag whose halves disagree.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: v
        name: Decide whether this commit releases
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$TAG is already tagged. Bump the version to release."
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Releasing $TAG."
          fi

  release:
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    # The GitHub environment is kept for the Deployments log, NOT as a gate: its
    # protection rules were removed on purpose (2026-08-30). Merging the PR into
    # main is the approval; a second click here approved nothing new.
    # Do not add required reviewers back unless you want that click again.
    environment: production
    env:
      TAG: ${{ needs.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install
        run: npm ci

      # The version stamp in index.html is hand-edited, and test.js fails when it
      # disagrees with package.json. This is the last gate before an irreversible deploy.
      - name: Test
        run: npm test

      - name: Apply D1 migrations
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@4 d1 migrations apply memento-mori --remote

      - name: Deploy the Worker
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@4 deploy

      - name: Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"

      # Notes come from commit subjects, not --generate-notes: they list each commit
      # since the last tag, which is more than the PR titles say.
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PREV=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)
          if [ -n "$PREV" ]; then
            LOG=$(git log --no-merges --invert-grep --grep="^Bump version" --format="* %s" "$PREV..$TAG")
            LINK="**Full Changelog**: https://github.com/${{ github.repository }}/compare/$PREV...$TAG"
          else
            LOG=$(git log --no-merges --format="* %s" "$TAG")
            LINK=""
          fi
          printf '## What'"'"'s Changed\n%s\n\n%s\n' "$LOG" "$LINK" \
            | gh release create "$TAG" --title "$TAG" --notes-file -

name: Staging

# The PR preview. Every push to a pull request into main that touches worker/
# redeploys memento-mori-staging.<subdomain>.workers.dev, so a change can be checked
# from a phone before the PR is merged. One staging Worker: the last PR pushed wins.
#
# A SEPARATE file from ci.yml on purpose: the two need opposite concurrency policies.
# CI cancels a superseded run; a deploy must never be cancelled between "migrations
# applied" and "Worker deployed".
#
# It does NOT run the tests. ci.yml runs them on the same push, and a migration that
# fails here is exactly the failure this environment exists to find before production.
#
# No `npm ci`: nothing but wrangler runs, and npx fetches that.

on:
  pull_request:
    branches: [main]
    paths: ['worker/**']
  workflow_dispatch:
    inputs:
      reseed:
        description: 'Also wipe the staging database and load worker/seed.sql again'
        type: boolean
        default: false

concurrency:
  group: staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v7

      # Same order as production: new code must never meet an old schema.
      - name: Apply D1 migrations
        run: npx wrangler@4 d1 migrations apply memento-mori-staging --env staging --remote

      # Only on request. Seeding on every push would wipe whatever you were part way
      # through testing; run this workflow by hand once after creating the database,
      # and again whenever staging needs a clean slate.
      - name: Load worker/seed.sql
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.reseed }}
        run: npx wrangler@4 d1 execute memento-mori-staging --env staging --remote --file=./seed.sql

      - name: Deploy the staging Worker
        run: npx wrangler@4 deploy --env staging
